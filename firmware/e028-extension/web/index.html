<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPGA Instrument</title><style>body{background:#101b20;color:#e7fff4;font:17px system-ui;max-width:820px;margin:24px auto;padding:14px}h1{color:#7ef3bd}button,select{font:inherit;background:#263d42;color:white;border:1px solid #638a82;border-radius:8px;padding:12px;margin:4px}button.on{background:#438e6c}.keys{display:flex;flex-wrap:wrap}.keys button{min-width:65px;height:110px;touch-action:none}label{display:block;margin:18px 0}input{width:65%}pre{white-space:pre-wrap;font-size:13px;color:#9ec9bb}small{color:#adc2c0}</style><h1>FPGA Instrument</h1><small>E030 / local Wi-Fi controller / audio comes from PCM DAC</small><p id="link">Connecting...</p><button id="stop">STOP ALL</button><button id="demo">32 voices: hold</button><label>Timbre <select id="t"><option>Electric piano</option><option>Organ</option><option>Strings</option><option>Bass</option></select></label><div class="keys" id="keys"></div><label>Volume <input id="v" type="range" min="0" max="128" value="64"></label><label>Brightness <input id="y" type="range" min="0" max="255" value="128"></label><label>Vibrato <input id="x" type="range" min="0" max="100" value="0"></label><label>Bend <input id="b" type="range" min="0" max="16383" value="8192"></label><label>Effects <select id="f"><option value="0">Dry</option><option value="1">Chorus</option><option value="2">Delay</option><option value="4">Reverb</option><option value="7">All</option></select></label><label>OLED <select id="s"><option>Wave</option><option>Spectrum</option><option>Stereo XY</option><option>Practice</option><option>Status</option></select></label><button id="song">Song on/off</button><pre id="status">Waiting for FPGA</pre><script>
let mask=0,song=0,queue=Promise.resolve(),dead=false,generation=0,polling=false;const $=id=>document.getElementById(id),hex=(n,d=2)=>(n>>>0).toString(16).toUpperCase().padStart(d,'0');
function cmd(c){const g=generation;queue=queue.catch(()=>{}).then(async()=>{if(g!==generation)return;const r=await fetch('/c/'+c,{cache:'no-store',signal:AbortSignal.timeout(4500)});if(!r.ok)throw Error(r.status);$('link').textContent='Connected to FPGA E030';dead=false}).catch(e=>{dead=true;$('link').textContent='Connection lost: release keys, reconnect Wi-Fi'});return queue}
function notes(){cmd('M'+hex(mask,8))}function stop(){generation++;mask=0;document.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));cmd('M00000000');cmd('D00');cmd('R00');cmd('H00')}
['C','D','E','F','G','A','B','C+'].forEach((name,i)=>{const n=[12,14,16,17,19,21,23,24][i],b=document.createElement('button');b.textContent=name;$('keys').append(b);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);mask=(mask|(1<<n))>>>0;b.classList.add('on');notes()};b.onpointerup=b.onpointercancel=e=>{mask=(mask&~(1<<n))>>>0;b.classList.remove('on');notes()}});
$('stop').onclick=stop;$('demo').onpointerdown=e=>{e.target.setPointerCapture(e.pointerId);cmd('D01')};$('demo').onpointerup=$('demo').onpointercancel=()=>cmd('D00');
for(const [id,k] of [['t','T'],['f','F'],['s','S']])$(id).onchange=()=>cmd(k+hex(id==='f'?+$(id).value:$(id).selectedIndex));
for(const [id,k,d] of [['v','V',2],['y','Y',2],['x','X',2],['b','B',4]])$(id).onchange=()=>cmd(k+hex(+$(id).value,d));
$('b').onpointerup=()=>{$('b').value=8192;cmd('B2000')};$('song').onclick=()=>{song^=1;cmd('R'+hex(song))};
window.onblur=stop;document.onvisibilitychange=()=>{if(document.hidden)stop()};
setInterval(()=>{if(document.hidden||polling)return;polling=true;queue=queue.catch(()=>{}).then(async()=>{const r=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(4500)});$('status').textContent=await r.text()}).catch(()=>{});cmd('Q00').finally(()=>polling=false)},1500);
cmd('V40');cmd('M00000000');
</script>
